# ============================================================
# Input data
# ============================================================

metadata_input: ../Metadata/HCC_MUW_metadata.xlsx
data_input: ../Data/exist.csv
lib_metadata_input: ../Metadata/combined_libraries_with_lineages_important_info_nonAAseq.pkl

project: HCC_MUW

group_tests:
  - censored
  - deceased

col_sample_name: SampleName
col_target: "OS Status"
col_predict: class1_proba

peptide_prefixes:
  - agilent_
  - twist_
  - corona2_

random_state: 420


# ============================================================
# Additional metadata features
# ============================================================

extra_features_to_include:
  - "OS months"


# ============================================================
# Survival-analysis execution
# ============================================================

survival:
  # General execution
  #seed: 420
  run_nested_cv: true
  use_pretrained: false
  only_train_model: false

  # Feature configuration
  subgroup: all
  with_oligos: true
  with_additional_features: true

  # Training peptide prevalence filter
  prevalence_threshold_min: 2
  prevalence_threshold_max: 98

  # Nested cross-validation
  outer_cv_splits: 2
  inner_cv_splits: 2
  n_iter: 2
  max_time_point: 25

  # Parallelization:
  # outer folds sequential, inner optimization parallel
  n_jobs_outer: 1
  n_jobs_inner: -1

  # Survival outcome
  time_column: "OS months"

  # Hyperparameter-search section used below
  param_grid_name: xgboost

  # Metadata-variable preprocessing
  impute_extra_numeric: false
  extra_numeric_impute_strategy: median

  # Output settings
  # Relative paths are resolved from the YAML file location.
  output_dir: ../results/HCC_MUW
  output_name: HCC-ICI

  # Training cohort
  train_filters:
    treatment: ICI

  # External validation cohorts
  validation_sets:
    - name: HCC-ICI_HCC-TKI
      filters:
        treatment: TKI

    - name: HCC-ICI_HCC-eICI
      filters:
        treatment: e_ICI


# ============================================================
# Bayesian hyperparameter search
# ============================================================

param_grid:
  xgboost:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
      prior: uniform

    preprocessor__peptides__feature_selection__estimator__alpha_min_ratio:
      type: real
      low: 0.005
      high: 0.1
      prior: log-uniform

    preprocessor__peptides__feature_selection__estimator__n_alphas:
      type: integer
      low: 50
      high: 200

    estimator__learning_rate:
      type: real
      low: 0.01
      high: 0.3
      prior: log-uniform

    estimator__max_depth:
      type: integer
      low: 3
      high: 10

    estimator__subsample:
      type: real
      low: 0.6
      high: 1.0
      prior: uniform

    estimator__colsample_bytree:
      type: real
      low: 0.6
      high: 1.0
      prior: uniform

    estimator__reg_lambda:
      type: real
      low: 0.01
      high: 10.0
      prior: log-uniform

    estimator__n_estimators:
      type: integer
      low: 50
      high: 500
